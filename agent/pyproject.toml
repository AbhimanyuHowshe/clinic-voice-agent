[project]
name = "clinic-voice-agent"
version = "0.1.0"
description = "AI voice receptionist for clinics (LiveKit Agents + Sarvam + LangGraph)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "livekit-agents==1.8.8",
    "livekit-plugins-sarvam==1.8.8",
    "livekit-plugins-langchain==1.8.8",
    "livekit-plugins-silero==1.8.8",
    "livekit-plugins-turn-detector==1.8.8",
    "langgraph==1.2.16",
    "langchain-core==1.6.12",
    "langchain-sarvam==0.1.2",
    "supabase==2.33.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.uv]
package = false
